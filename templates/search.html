<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Diagnose | Cocoa Friendly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .search-card {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="search-card text-center">
            <h2 class="fw-bold mb-3"><i class="fa-solid fa-seedling text-warning me-2"></i>Cocoa Disease Scanner</h2>
            <p class="text-muted mb-4">Upload an image of a cocoa pod to diagnose potential infections and receive actionable recommendations.</p>
            
            <form method="POST" action="/search" enctype="multipart/form-data">
                <div class="mb-4">
                    <input class="form-control form-control-lg" type="file" name="file" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-warning btn-lg w-100 text-white fw-bold shadow-sm">
                    <i class="fa-solid fa-magnifying-glass me-2"></i>Start Diagnostic Scan
                </button>
            </form>
            <div class="mt-4">
                <a href="/" class="text-secondary text-decoration-none small">
                    <i class="fa-solid fa-arrow-left me-1"></i>Back to Home Page
                </a>
            </div>
        </div>
    </div>
</body>
</html>
